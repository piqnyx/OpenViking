# piqnyx: the facts the image is built from (PIQNYX.md, stage 2).
# Read by the scripts of this folder; one fact a line, NAME=value, no quotes.

# The tag of upstream our branch grows from.
TAG=v0.4.12
# The package version that tag carries.
PACKAGE_VERSION=0.4.12
# The image that runs on the server, by its digest: the tag `latest` moves, a digest does not.
BASE=ghcr.io/volcengine/openviking@sha256:0d99361a0029ce5221fd11588d9f0f374c6e5f8f1eacbcf1d76de6a0f6cd82cb
# Where that image keeps the packages.
SITE=/app/.venv/lib/python3.13/site-packages
# The user the server runs as in our compose file; the check from inside runs as this user.
RUN_AS=1001:1001
# The name and the version of ours. A new build that is to replace one in work takes a new version.
NAME=piqnyx/openviking
VERSION=0.4.12-piqnyx.2

# The tests inside the images (stage 2.5). The tools are taken from PyPI into a folder of their
# own and lent to the tests; the first two are the versions upstream has in its lock.
TEST_TOOLS=pytest==9.0.2 pytest-asyncio==1.3.0 pytest-timeout==2.4.0
# The longest one test may take, seconds, and the longest one run may take, minutes.
TEST_EACH=120
TEST_LONGEST=90
# What a run may take of the server while the server works.
TEST_CPUS=4
TEST_MEMORY=8g

# The replacement of the container (stage 2.6). The compose file is named from the root of the
# clone; the service and the container are what that file calls them.
COMPOSE=../docker-compose.yml
SERVICE=openviking
CONTAINER=openviking
# How long the new server may take to get well, seconds. The compose file looks at its health
# every 30 s and gives it 30 s to start; three looks that fail make it unwell.
HEALTHY_WITHIN=180
